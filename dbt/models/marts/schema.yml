version: 2

sources:
  - name: gold
    schema: analytics
    tables:
      - name: daily_account_activity
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: event_date

models:
  - name: account_risk_daily
    description: One row per account per day with a plain-rules risk flag.
    columns:
      - name: event_date
        tests: [not_null]
      - name: account_id
        tests: [not_null]
      - name: risk_flag
        tests:
          - accepted_values:
              values: [normal, multi_country, volume_spike, repeated_high_value]
      - name: amount_vs_baseline
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [event_date, account_id]
