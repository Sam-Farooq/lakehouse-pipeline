name: lakehouse
version: "1.2.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
test-paths: ["tests"]

models:
  lakehouse:
    staging:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +partition_by: {field: event_date, data_type: date, granularity: day}
