name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dags
      # No ivy cache: the test session runs without the Delta extensions, so
      # nothing is fetched from Maven. Delta is exercised in the streaming
      # jobs, which need a cluster and are not unit tested here.
      - run: pytest -q --tb=short

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install dbt-bigquery dbt-core
      - run: cd dbt && dbt parse --target ci
      - run: cd dbt && dbt compile --target ci

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/
      - run: helm template helm/ > /dev/null
