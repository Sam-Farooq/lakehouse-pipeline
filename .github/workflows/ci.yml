name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dags
      # Delta's jars resolve on first session; cache so CI is not 4 minutes
      # of Maven on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('pyproject.toml') }}
      - run: pytest -q --tb=short

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install dbt-bigquery dbt-core
      - run: cd dbt && dbt parse --target ci
      - run: cd dbt && dbt compile --target ci

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/
      - run: helm template helm/ > /dev/null
